name: Rendering issue
description: Report a player model, emote, or cosmetic that looks wrong.
body:
  - type: textarea
    id: problem
    attributes:
      label: What looks wrong?
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include MiniWynn, Minecraft, Fabric Loader, and resource-pack versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the emote or cosmetic name if applicable.
  - type: textarea
    id: mods
    attributes:
      label: Other rendering mods
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Attach an image if useful. Hide chat and personal information.
